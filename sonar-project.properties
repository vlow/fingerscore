# SonarCloud analysis, run by the sonar job in .github/workflows/ci.yml.
sonar.host.url=https://sonarcloud.io
sonar.organization=vlow
sonar.projectKey=vlow_fingerscore

sonar.sources=src,scripts
sonar.tests=src,e2e,e2e-preview
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**,src/test-setup.ts,e2e/**,e2e-preview/**
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**,src/test-setup.ts

# Written by `npm test -- --coverage`. Scripts run outside the unit tests, so they count for no coverage.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=scripts/**

# The job waits for the quality gate and fails when the gate fails.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
