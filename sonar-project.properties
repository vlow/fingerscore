# SonarCloud analysis, run by the sonar job in .github/workflows/ci.yml.
sonar.host.url=https://sonarcloud.io
sonar.organization=vlow
sonar.projectKey=vlow_fingerscore

# SonarCloud analyses the whole repository and finds the test files itself; sonar.sources and sonar.tests have no
# effect on this project. Coverage and duplication count for the app in src/ only.
sonar.coverage.exclusions=scripts/**,e2e/**,e2e-preview/**,src/test/**,src/test-setup.ts,**/*.test.ts,**/*.test.tsx,**/*.d.ts,*.config.ts
sonar.cpd.exclusions=e2e/**,e2e-preview/**,src/test/**,**/*.test.ts,**/*.test.tsx

# Written by `npm test -- --coverage`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# The job waits for the quality gate and fails when the gate fails.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
