<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The chosen theme, before the first paint (src/state/theme.ts reads the same key). -->
    <script>try{var t=localStorage.getItem("fingerscore.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fingerscore</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171A1F" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/shell/main.tsx"></script>
  </body>
</html>
