# fingerscore: how nginx serves the build. Included inside a server block that sets `root` to the deployed dist/
# (fingerscore.conf for the site, ci.conf for CI). Design: docs/superpowers/specs/2026-11-26-fingerscore-caching-design.md.

# The build writes x.br (brotli 11) and x.gz (gzip 9) beside each text file (scripts/precompress). nginx sends the
# smallest form the browser accepts and compresses nothing itself. brotli_static needs ngx_brotli
# (Debian/Ubuntu: libnginx-mod-http-brotli-static); without it, delete the brotli_static line and nginx sends gzip.
brotli_static on;
gzip_static on;
gzip_vary on;
gzip off;

# Hashed file names: a changed file gets a new name, so a copy may be kept for a year without asking again.
# A missing chunk is a plain 404, never the app's HTML: the page then reports a failed load, not a MIME error.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
    error_page 404 = @missing;
}

location @missing {
    return 404 "Not found\n";
}

# The app's HTML: the browser asks again on every visit; an unchanged file costs a 304.
location = /index.html {
    add_header Cache-Control "no-cache" always;
}

# Its own type also when sent from manifest.webmanifest.br (nginx's mime.types may not know the extension).
location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=86400" always;
}

# Icons, the demo song, the notices: not hashed, so a change shows within a day. Every other path is a page of the app
# (/sheet, /scales, ...): history routing answers it with index.html.
location / {
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri /index.html;
}
