# fingerscore's site. Fill in every TODO, put this file in /etc/nginx/sites-enabled/, then `nginx -t && systemctl reload nginx`.
# Install first: apt install nginx libnginx-mod-http-brotli-static (README, "Hosting").

server {
    listen 80;
    listen [::]:80;
    server_name example.org;  # TODO: the domain
    return 301 https://$host$request_uri;
}

server {
    # `listen ... http2`, not `http2 on;`: the directive needs nginx 1.25.1, Ubuntu 24.04 ships 1.24. Newer nginx accepts
    # this form with a deprecation warning.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.org;  # TODO: the domain

    ssl_certificate     /etc/letsencrypt/live/example.org/fullchain.pem;  # TODO: certificate
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;    # TODO: key

    root /var/www/fingerscore;  # TODO: where the deploy copies dist/

    # Every location in this file sets its own Cache-Control, and an add_header inside a location drops the server's.
    # A header for every answer (HSTS, a CSP) therefore goes into each location there, not here.
    include /etc/nginx/fingerscore-locations.conf;  # TODO: where you copied deploy/nginx/fingerscore-locations.conf
}
